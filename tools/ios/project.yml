# Fallback only: if Xcode ever refuses to open TESIFR.xcodeproj, regenerate it with
#   brew install xcodegen && cd ios && xcodegen generate
name: TESIFR
options: { deploymentTarget: { iOS: "16.0" } }
targets:
  TESIFR:
    type: application
    platform: iOS
    sources:
      - TESIFR
      - path: ../docs
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tacticaledge.tesifr
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "PPA IFR"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo of a logbook page so it can be turned into entries you review before saving."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Practice oral-exam answers out loud and use voice features in Brief It."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choose a photo of a logbook page or chart to use in a lesson."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Turn your spoken oral-exam answers into text so you can review them."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
